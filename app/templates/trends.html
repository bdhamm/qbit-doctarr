{% extends "base.html" %}
{% block body_class %}body-fixed{% endblock %}
{% block content %}
<div class="row mb-4 flex-shrink-0">
    <div class="col-12 d-flex justify-content-between align-items-center" style="min-height: 52px;">
        <div>
            <h4 class="mb-0"><i class="bi bi-graph-up text-primary"></i> Trends</h4>
            <div class="text-muted small mt-1">Historical file counts over time. Hourly snapshots, retained for 30 days.</div>
        </div>
        <div class="d-flex gap-2 align-items-center">
            <button type="button" class="btn btn-outline-info" id="snapshot-btn" title="Take a snapshot now">
                <i class="bi bi-camera"></i> <span id="snapshot-btn-label">Snapshot Now</span>
            </button>
            <div class="btn-group" role="group" aria-label="Range selector">
                <button type="button" class="btn btn-outline-secondary range-btn active" data-days="1">24h</button>
                <button type="button" class="btn btn-outline-secondary range-btn" data-days="7">7d</button>
                <button type="button" class="btn btn-outline-secondary range-btn" data-days="30">30d</button>
            </div>
        </div>
    </div>
</div>

<div class="page-content" style="gap: 1rem;">
    <div class="card shadow-sm border-secondary d-flex flex-column" style="flex: 1 1 0; min-height: 0;">
        <div class="card-header bg-dark border-secondary py-2 flex-shrink-0">
            <h6 class="mb-0 text-light"><i class="bi bi-search text-primary"></i> Missing Media Sync</h6>
        </div>
        <div class="card-body d-flex flex-column" style="min-height: 0;">
            <div class="position-relative flex-grow-1" style="min-height: 0;">
                <canvas id="chart-missing"></canvas>
            </div>
            <div class="small text-muted mt-2 flex-shrink-0" id="summary-missing">Loading…</div>
        </div>
    </div>
    <div class="card shadow-sm border-secondary d-flex flex-column" style="flex: 1 1 0; min-height: 0;">
        <div class="card-header bg-dark border-secondary py-2 flex-shrink-0">
            <h6 class="mb-0 text-light"><i class="bi bi-activity text-danger"></i> Torrent Cleanup</h6>
        </div>
        <div class="card-body d-flex flex-column" style="min-height: 0;">
            <div class="position-relative flex-grow-1" style="min-height: 0;">
                <canvas id="chart-stalled"></canvas>
            </div>
            <div class="small text-muted mt-2 flex-shrink-0" id="summary-stalled">Loading…</div>
        </div>
    </div>
</div>

<div class="mt-2 flex-shrink-0 d-none" id="snapshot-alert-row">
    <div class="alert alert-dismissible fade show py-2 mb-0" id="snapshot-alert" role="alert">
        <span id="snapshot-alert-text"></span>
        <button type="button" class="btn-close" onclick="hideSnapshotAlert()" aria-label="Close"></button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='vendor/chart.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/trends.js') }}"></script>
{% endblock %}
