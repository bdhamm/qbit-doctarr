{% extends "base.html" %}
{% block body_class %}body-fixed{% endblock %}
{% block content %}
<div class="row mb-4 flex-shrink-0">
    <div class="col-12 d-flex justify-content-between align-items-center" style="min-height: 52px;">
        <div>
            <h4 class="mb-0"><i class="bi bi-clock-history text-primary"></i> Activity History</h4>
            <div class="text-muted small mt-1">View recent actions performed by qbit-doctarr</div>
        </div>
        <div class="d-flex gap-2 align-items-center">
            <input type="text" id="search-input" class="form-control" placeholder="Search loaded history..." onkeyup="renderHistory()" style="width: 300px;">
            <button class="btn btn-outline-info" style="min-width: 140px;" onclick="fetchHistory(true)">Refresh Now</button>
        </div>
    </div>
</div>

<div class="page-content">
    <div class="card shadow-sm border-secondary mb-0">
        <div class="card-body p-0 table-container">
            <table class="table table-dark table-striped table-hover mb-0" id="history-table">
                <thead style="position: sticky; top: 0; background-color: #212529; z-index: 1;">
                    <tr>
                        <th style="width: 15%;">Task</th>
                        <th style="width: 70%;">Details</th>
                        <th style="width: 15%;">Time</th>
                    </tr>
                </thead>
                <tbody id="history-tbody">
                    <tr><td colspan="3" class="text-center text-muted py-4">Loading history...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="text-center my-4 flex-shrink-0">
    <button id="load-more-btn" class="btn btn-outline-secondary d-none" onclick="loadMore()">Load More</button>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
{% endblock %}
